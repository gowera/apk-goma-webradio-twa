plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
}

def releaseSigning = [
    storeFile: providers.gradleProperty('RELEASE_STORE_FILE').orElse(providers.environmentVariable('ANDROID_KEYSTORE_PATH')).orNull,
    storePassword: providers.gradleProperty('RELEASE_STORE_PASSWORD').orElse(providers.environmentVariable('ANDROID_KEYSTORE_PASSWORD')).orNull,
    keyAlias: providers.gradleProperty('RELEASE_KEY_ALIAS').orElse(providers.environmentVariable('ANDROID_KEY_ALIAS')).orNull,
    keyPassword: providers.gradleProperty('RELEASE_KEY_PASSWORD').orElse(providers.environmentVariable('ANDROID_KEY_PASSWORD')).orNull,
]
def hasReleaseSigning = releaseSigning.values().every { it != null && !it.trim().isEmpty() }

android {
    namespace 'com.gomawebradio.app.twa'
    compileSdkVersion 36

    defaultConfig {
        applicationId 'com.gomawebradio.app.twa'
        minSdkVersion 24
        targetSdkVersion 36
        versionCode 11
        versionName '1.9'
    }

    if (hasReleaseSigning) {
        signingConfigs {
            release {
                storeFile file(releaseSigning.storeFile)
                storePassword releaseSigning.storePassword
                keyAlias releaseSigning.keyAlias
                keyPassword releaseSigning.keyPassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

tasks.matching { it.name == 'preReleaseBuild' }.configureEach {
    doFirst {
        if (!hasReleaseSigning) {
            throw new GradleException('Configure RELEASE_STORE_FILE, RELEASE_STORE_PASSWORD, RELEASE_KEY_ALIAS and RELEASE_KEY_PASSWORD (or the matching ANDROID_KEYSTORE_* environment variables) before building a release.')
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.core:core-ktx:1.6.0'
    implementation 'androidx.webkit:webkit:1.14.0'
    implementation 'com.google.android.material:material:1.12.0'
    // Firebase Messaging
    implementation platform('com.google.firebase:firebase-bom:33.2.0')
    implementation 'com.google.firebase:firebase-messaging'
    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.google.firebase:firebase-database'
}
